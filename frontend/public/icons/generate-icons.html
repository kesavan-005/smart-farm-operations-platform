<!-- Utility page: open in browser to generate PWA icon PNGs from the app logo -->
<!-- After generation, the canvas data is saved as downloadable files. -->
<!-- This file is only for development convenience and is not served in production. -->
<!DOCTYPE html>
<html>
<head><title>Generate PWA Icons</title></head>
<body>
<h2>PWA Icon Generator — Smart Farm</h2>
<p>Icons are generated programmatically below.</p>
<canvas id="c192" width="192" height="192"></canvas>
<canvas id="c512" width="512" height="512"></canvas>
<canvas id="cmask" width="512" height="512"></canvas>
<script>
function drawIcon(canvas, size, maskable) {
  const ctx = canvas.getContext('2d');
  // Background
  if (maskable) {
    // Maskable: fill entire canvas with brand color
    ctx.fillStyle = '#059669';
    ctx.fillRect(0, 0, size, size);
  } else {
    // Rounded rect background
    ctx.fillStyle = '#059669';
    const r = size * 0.18;
    ctx.beginPath();
    ctx.moveTo(r, 0);
    ctx.lineTo(size - r, 0);
    ctx.quadraticCurveTo(size, 0, size, r);
    ctx.lineTo(size, size - r);
    ctx.quadraticCurveTo(size, size, size - r, size);
    ctx.lineTo(r, size);
    ctx.quadraticCurveTo(0, size, 0, size - r);
    ctx.lineTo(0, r);
    ctx.quadraticCurveTo(0, 0, r, 0);
    ctx.closePath();
    ctx.fill();
  }
  
  // Leaf icon
  const cx = size / 2;
  const cy = size / 2;
  const s = size * 0.28;
  
  ctx.save();
  ctx.translate(cx, cy);
  
  // Leaf shape
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.moveTo(0, -s);
  ctx.bezierCurveTo(s * 0.8, -s * 0.8, s, -s * 0.2, s * 0.8, s * 0.3);
  ctx.bezierCurveTo(s * 0.6, s * 0.7, s * 0.2, s, 0, s);
  ctx.bezierCurveTo(-s * 0.2, s, -s * 0.6, s * 0.7, -s * 0.8, s * 0.3);
  ctx.bezierCurveTo(-s, -s * 0.2, -s * 0.8, -s * 0.8, 0, -s);
  ctx.closePath();
  ctx.fill();
  
  // Leaf vein
  ctx.strokeStyle = '#059669';
  ctx.lineWidth = size * 0.02;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(0, -s * 0.6);
  ctx.lineTo(0, s * 0.6);
  ctx.stroke();
  
  // Side veins
  ctx.lineWidth = size * 0.015;
  ctx.beginPath();
  ctx.moveTo(0, -s * 0.2);
  ctx.lineTo(s * 0.35, -s * 0.45);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(0, -s * 0.2);
  ctx.lineTo(-s * 0.35, -s * 0.45);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(0, s * 0.15);
  ctx.lineTo(s * 0.4, -s * 0.05);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(0, s * 0.15);
  ctx.lineTo(-s * 0.4, -s * 0.05);
  ctx.stroke();
  
  ctx.restore();
}

drawIcon(document.getElementById('c192'), 192, false);
drawIcon(document.getElementById('c512'), 512, false);
drawIcon(document.getElementById('cmask'), 512, true);

// Auto-download
function download(canvas, name) {
  const a = document.createElement('a');
  a.download = name;
  a.href = canvas.toDataURL('image/png');
  a.click();
}

document.querySelectorAll('canvas').forEach(c => {
  const p = document.createElement('p');
  p.textContent = c.id + ': ' + c.width + 'x' + c.height;
  c.parentNode.insertBefore(p, c.nextSibling);
});
</script>
</body>
</html>
